host: 0.0.0.0
port: 8444
node_id: ""

# Shared key material with Dashburg hub
key_id: hub-main
shared_secret: CHANGE_ME_LONG_RANDOM_SECRET
auth_max_skew_seconds: 60
auth_required: true

data_dir: /var/lib/dashburg-runner
log_file: /var/log/dashburg-runner.log

apt_upgrade_enabled: false
codex_enabled: true
webagent_enabled: false

# Optional command used for `webagent.run` jobs.
# The command is executed with:
# - WEBAGENT_REQUEST_JSON
# - WEBAGENT_RESULT_JSON
# - WEBAGENT_ARTIFACT_DIR
# - WEBAGENT_TARGET_URL
# - WEBAGENT_RUN_TYPE
# Example:
# webagent_command: "/opt/webagent/.venv/bin/python /opt/webagent/run_job.py"
webagent_command: ""
webagent_node_api_base: "http://127.0.0.1:9477"
webagent_node_api_token_env: "WEBAGENT_NODE_API_TOKEN"
webagent_node_api_token: ""
webagent_node_artifacts_dir: "/opt/dashburg/browser-qa-node/artifacts"
webagent_timeout_seconds: 900
webagent_poll_interval_seconds: 2.0
webagent_action_timeout_seconds: 45

allowed_repos:
  - /srv/repos/dashgithub

allowed_services:
  - dashgithub-api
  - topic-runner

allowed_compose_dirs:
  - /srv/compose/my-stack
